# CasaGuard / Frigate 0.16 configuration
# Logitech USB webcam, CPU only, one room. No MQTT broker is required.

mqtt:
  enabled: false

ffmpeg:
  global_args: -hide_banner -loglevel warning -threads 2
  hwaccel_args: "" # AMD Ryzen host: intentionally software decode only

detectors:
  cpu1:
    type: cpu
    num_threads: 2

go2rtc:
  streams:
    room:
      # Frigate's supported webcam path: go2rtc owns /dev/video0 and restreams it.
      # If camera-test.sh reports a different supported format, adjust this line.
      - "ffmpeg:device?video=/dev/video0&video_size=640x480&framerate=5#video=h264"

cameras:
  room:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/room
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
        - cat
        - dog
        - cell phone
        - laptop
      filters:
        person:
          min_area: 8000
          threshold: 0.7
    review:
      alerts:
        labels:
          - person
    record:
      enabled: true
    snapshots:
      enabled: true
      retain:
        default: 30
        objects:
          person: 30

record:
  enabled: true
  # Keep continuous video for seven days. Alert/detection segments are retained
  # for 30 days, so a person event is available after continuous video expires.
  continuous:
    days: 7
  alerts:
    retain:
      days: 30
      mode: all
  detections:
    retain:
      days: 30
      mode: all

snapshots:
  enabled: true
  retain:
    default: 30
    objects:
      person: 30
